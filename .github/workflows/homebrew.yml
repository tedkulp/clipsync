name: Update Homebrew Tap

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish to the tap (e.g. v0.2.0)
        required: true

permissions:
  contents: read

jobs:
  update-tap:
    name: Update Homebrew cask
    # Drafts can't be downloaded, so this runs on publish; skip prereleases.
    if: github.event_name == 'workflow_dispatch' || !github.event.release.prerelease
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}

    steps:
      # Use the default branch so the cask template has the latest stanzas;
      # only the version and sha256 come from the release.
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Download DMG and compute checksum
        id: dmg
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${TAG#v}"
          dmg="ClipSync_${version}_universal.dmg"
          gh release download "$TAG" -R "${{ github.repository }}" --pattern "$dmg" --dir dist
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "sha256=$(sha256sum "dist/$dmg" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Render cask
        run: |
          sed -e 's/^  version ".*"$/  version "${{ steps.dmg.outputs.version }}"/' \
              -e 's/^  sha256 ".*"$/  sha256 "${{ steps.dmg.outputs.sha256 }}"/' \
              clipsync.rb > cask.rb
          grep -q '^  version "${{ steps.dmg.outputs.version }}"$' cask.rb
          grep -q '^  sha256 "${{ steps.dmg.outputs.sha256 }}"$' cask.rb
          cat cask.rb

      - name: Checkout tap
        uses: actions/checkout@v5
        with:
          repository: tedkulp/homebrew-tap
          token: ${{ secrets.HOMEBREW_TOKEN }}
          path: homebrew-tap

      - name: Commit and push cask
        working-directory: homebrew-tap
        run: |
          mkdir -p Casks
          cp ../cask.rb Casks/clipsync.rb
          # The old source-build formula is replaced by the cask.
          git rm -q --ignore-unmatch Formula/clipsync.rb
          git add Casks/clipsync.rb
          if git diff --cached --quiet; then
            echo "Tap already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Brew cask update for clipsync version $TAG"
          git push
